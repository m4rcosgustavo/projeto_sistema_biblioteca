<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Sistema de Biblioteca{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="cabecalho">
        <div class="container">

            <a class="logo" href="/">
                <span class="logo-icone">B</span>
                <span>Biblioteca</span>
            </a>

            <nav class="menu">
                <a href="/">Início</a>

                <a href="{{ url_for('autores.listar_autores') }}">
                    Autores
                </a>

                <a href="{{ url_for('livros.listar_livros') }}">
                    Livros
                </a>

                <a href="{{ url_for('leitores.listar_leitores') }}">
                    Leitores
                </a>
                <a href="{{ url_for('emprestimos.novo_emprestimo') }}">
                    Empréstimos
                </a>
            </nav>

        </div>
    </header>

    <main class="container conteudo">

        {% with mensagens = get_flashed_messages(with_categories=true) %}

            {% for categoria, mensagem in mensagens %}

                <div class="alerta {{ categoria }}">
                    {{ mensagem }}
                </div>

            {% endfor %}

        {% endwith %}

        {% block content %}
        {% endblock %}

    </main>

    <footer class="rodape">
        <div class="container">
            <p>Sistema de Biblioteca</p>
        </div>
    </footer>

</body>
</html>
