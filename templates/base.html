
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Biblioteca{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="cabecalho">
        <div class="container">
            <a class="logo" href="/">
                <span class="logo-icone">B</span>
                <span>Biblioteca</span>
            </a>

            <nav class="menu">
                <a href="/">Início</a>
                <a href="#autores">Autores</a>
                <a href="#livros">Livros</a>
                <a href="#leitores">Leitores</a>
            </nav>
        </div>
    </header>

    <main class="container conteudo">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="rodape">
        <div class="container">
            <p>Sistema de Biblioteca</p>
        </div>
    </footer>
</body>
</html>
