
{% extends "base.html" %}

{% block title %}Novo Empréstimo{% endblock %}

{% block content %}

<a href="{{ url_for('emprestimos.listar_emprestimos') }}"
   class="voltar">
    ← Voltar para empréstimos
</a>

<div class="form-card">

    <p class="sobretitulo">BIBLIOTECA</p>

    <h1>Novo Empréstimo</h1>

    <p class="descricao">
        Selecione o leitor e o livro para realizar o empréstimo.
    </p>

    <form method="POST">

        <label for="livro_id">Livro</label>

        <select name="livro_id" id="livro_id" required>
            <option value="">Selecione um livro</option>

            {% for livro in livros %}
            <option value="{{ livro.id }}">
                {{ livro.titulo }}
            </option>
            {% endfor %}
        </select>

        <label for="leitor_id">Leitor</label>

        <select name="leitor_id" id="leitor_id" required>
            <option value="">Selecione um leitor</option>

            {% for leitor in leitores %}
            <option value="{{ leitor.id }}">
                {{ leitor.nome }}
            </option>
            {% endfor %}
        </select>

        <div class="botoes-form">

            <button type="submit">
                Registrar empréstimo
            </button>

            <a href="{{ url_for('emprestimos.listar_emprestimos') }}"
               class="botao botao-secundario">
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
